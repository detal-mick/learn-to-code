<style>
  :root {
    --bg: #f0f4f8;
    --glass: rgba(255,255,255,0.55);
    --glass-border: rgba(255,255,255,0.8);

    --blue-light: #dbeafe;
    --blue-mid: #93c5fd;
    --red: #dc2626;
    --red-light: #fee2e2;
    --green: #16a34a;
    --green-light: #dcfce7;
    --text: #1e293b;
    --muted: #64748b;
    --white: #ffffff;
    --border: rgba(148,163,184,0.25);
    --radius: 18px;
    --radius-sm: 10px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {

    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 600px; height: 600px;
    background: radial-gradient(circle, #bfdbfe 0%, #93c5fd 60%, transparent 100%);
    top: -100px; left: -150px;
  }
  body::after {
    width: 500px; height: 500px;
    background: radial-gradient(circle, #e0e7ff 0%, #c7d2fe 60%, transparent 100%);
    bottom: -100px; right: -100px;
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }

  /* Header */
  .header {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--glass-shadow);
    padding: 22px 28px 18px;
    margin-bottom: 24px;
    text-align: center;
  }
  .header .badge {
    display: inline-block;
    background: var(--blue);
    color: white;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    padding: 3px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .header h1 {
    font-size: 1.45rem;
    font-weight: 900;
    color: var(--text);
    line-height: 1.2;
  }
  .header p {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 5px;
    font-weight: 500;
  }

  /* Progress bar */
  .progress-wrap {
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1.5px solid var(--glass-border);
    border-radius: 30px;
    box-shadow: var(--glass-shadow);
    padding: 12px 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .progress-label {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    white-space: nowrap;
  }
  .progress-bar-bg {
    flex: 1;
    height: 8px;
    background: rgba(148,163,184,0.2);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blue), #60a5fa);
    border-radius: 10px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }
  .progress-count {
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--blue);
    white-space: nowrap;
  }

  /* Section label */
  .section-label {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--blue);
    padding: 4px 12px;
    background: var(--blue-light);
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 10px;
  }

  /* Question card */
  .q-card {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--glass-shadow);
    padding: 22px 24px 18px;
    margin-bottom: 16px;
    transition: box-shadow 0.2s;
  }
  .q-card:hover {
    box-shadow: 0 12px 40px rgba(60,80,120,0.13), 0 2px 8px rgba(60,80,120,0.08);
  }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 14px;
  }
  .q-num {
    min-width: 30px; height: 30px;
    background: var(--blue);
    color: white;
    font-size: 0.78rem;
    font-weight: 800;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .q-text {
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.55;
    color: var(--text);
  }

  /* Reading passage */
  .passage {
    background: rgba(241,245,249,0.7);
    border-left: 3px solid var(--blue-mid);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 0.82rem;
    font-weight: 500;
    font-family: 'Nunito Sans', sans-serif;
    color: #334155;
    line-height: 1.65;
    margin-bottom: 12px;
    font-style: italic;
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 8px; }

  .opt {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 11px 15px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: rgba(255,255,255,0.6);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text);
    transition: all 0.18s ease;
    user-select: none;
    -webkit-user-select: none;
  }
  .opt:hover:not(.locked) {
    border-color: var(--blue-mid);
    background: rgba(219,234,254,0.5);
    transform: translateX(2px);
  }
  .opt.selected:not(.locked) {
    border-color: var(--blue);
    background: var(--blue-light);
    color: var(--blue);
    font-weight: 700;
  }
  .opt .opt-letter {
    width: 26px; height: 26px;
    border-radius: 6px;
    background: rgba(148,163,184,0.15);
    border: 1.5px solid rgba(148,163,184,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.18s;
  }
  .opt.selected:not(.locked) .opt-letter {
    background: var(--blue);
    border-color: var(--blue);
    color: white;
  }

  /* After submit: correct/wrong */
  .opt.correct {
    border-color: var(--green);
    background: var(--green-light);
    color: var(--green);
    font-weight: 700;
  }
  .opt.correct .opt-letter {
    background: var(--green); border-color: var(--green); color: white;
  }
  .opt.wrong {
    border-color: var(--red);
    background: var(--red-light);
    color: var(--red);
    font-weight: 700;
  }
  .opt.wrong .opt-letter {
    background: var(--red); border-color: var(--red); color: white;
  }
  .opt.locked { cursor: default; }
  .opt.locked:not(.correct):not(.wrong) {
    opacity: 0.45;
  }

  /* Submit button */
  .btn-row {
    display: flex;
    justify-content: center;
    margin: 28px 0 16px;
  }
  .btn-submit {
    background: var(--blue);
    color: white;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 800;
    padding: 14px 48px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(37,99,235,0.3);
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .btn-submit:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(37,99,235,0.35); }
  .btn-submit:active { transform: translateY(0); }
  .btn-submit:disabled { background: #94a3b8; box-shadow: none; cursor: not-allowed; transform: none; }

  /* Result panel */
  .result-panel {
    display: none;
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1.5px solid var(--glass-border);
    border-radius: var(--radius);
    box-shadow: var(--glass-shadow);
    padding: 28px 28px 24px;
    margin-bottom: 28px;
    text-align: center;
    animation: popIn 0.4s cubic-bezier(.17,.67,.35,1.3);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92); }
    to { opacity: 1; transform: scale(1); }
  }
  .result-panel.show { display: block; }

  .score-circle {
    width: 110px; height: 110px;
    border-radius: 50%;
    margin: 0 auto 16px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-weight: 900;
    position: relative;
  }
  .score-circle .score-num {
    font-size: 2.1rem;
    line-height: 1;
  }
  .score-circle .score-total {
    font-size: 0.75rem;
    font-weight: 700;
    opacity: 0.7;
  }

  .score-great { background: var(--green-light); color: var(--green); border: 3px solid var(--green); }
  .score-ok { background: var(--blue-light); color: var(--blue); border: 3px solid var(--blue); }
  .score-low { background: var(--red-light); color: var(--red); border: 3px solid var(--red); }

  .result-title { font-size: 1.2rem; font-weight: 900; margin-bottom: 4px; }
  .result-sub { font-size: 0.82rem; color: var(--muted); font-weight: 500; }

  .stat-row {
    display: flex; justify-content: center; gap: 24px; margin-top: 18px;
  }
  .stat-item { text-align: center; }
  .stat-val { font-size: 1.4rem; font-weight: 900; }
  .stat-lbl { font-size: 0.72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat-item.green .stat-val { color: var(--green); }
  .stat-item.red .stat-val { color: var(--red); }
  .stat-item.blue .stat-val { color: var(--blue); }

  .btn-reset {
    margin-top: 18px;
    background: white;
    color: var(--blue);
    border: 2px solid var(--blue);
    font-family: 'Nunito', sans-serif;
    font-size: 0.85rem;
    font-weight: 800;
    padding: 10px 30px;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-reset:hover { background: var(--blue); color: white; }

  /* Responsive */
  @media (max-width: 500px) {
    .wrap { padding: 16px 10px 50px; }
    .q-card { padding: 16px 14px 14px; }
    .header { padding: 16px 16px 14px; }
    .header h1 { font-size: 1.15rem; }
  }
</style>
</head>

let userAnswers = new Array(50).fill(null);
let submitted = false;
let lastPassageIndex = -1;

function buildQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';

  let currentSection = '';
  let passageHTML = '';

  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + i;

    let sectionHTML = '';
    if (q.section !== currentSection) {
      currentSection = q.section;
      sectionHTML = `<div class="section-label">${q.section}</div>`;
    }

    let passageBlock = '';
    if (q.text) {
      passageHTML = q.text;
      passageBlock = `<div class="passage">${q.text}</div>`;
    }

    const optLetters = ['A','B','C','D'];
    const optsHTML = q.options.map((opt, j) =>
      `<div class="opt" id="opt-${i}-${j}" onclick="selectAnswer(${i}, ${j})">
        <span class="opt-letter">${optLetters[j]}</span>
        <span>${opt}</span>
      </div>`
    ).join('');

    card.innerHTML = `
      ${sectionHTML}
      ${passageBlock}
      <div class="q-header">
        <div class="q-num">${i + 1}</div>
        <div class="q-text">${q.question}</div>
      </div>
      <div class="options">${optsHTML}</div>
    `;

    container.appendChild(card);
  });
}

function selectAnswer(qIdx, optIdx) {
  if (submitted) return;

  const prev = userAnswers[qIdx];
  if (prev !== null) {
    document.getElementById(`opt-${qIdx}-${prev}`).classList.remove('selected');
  }

  userAnswers[qIdx] = optIdx;
  document.getElementById(`opt-${qIdx}-${optIdx}`).classList.add('selected');
  updateProgress();
}

function updateProgress() {
  const answered = userAnswers.filter(a => a !== null).length;
  const pct = (answered / 50) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = answered + ' / 50';
}

function submitQuiz() {
  if (submitted) return;
  submitted = true;

  let correct = 0, wrong = 0, skip = 0;

  questions.forEach((q, i) => {
    const chosen = userAnswers[i];
    const correct_idx = q.answer;

    for (let j = 0; j < 4; j++) {
      const el = document.getElementById(`opt-${i}-${j}`);
      el.classList.add('locked');
      el.classList.remove('selected');
    }

    if (chosen === null) {
      skip++;
      // show correct answer faintly
      document.getElementById(`opt-${i}-${correct_idx}`).classList.add('correct');
    } else if (chosen === correct_idx) {
      correct++;
      document.getElementById(`opt-${i}-${correct_idx}`).classList.add('correct');
    } else {
      wrong++;
      document.getElementById(`opt-${i}-${chosen}`).classList.add('wrong');
      document.getElementById(`opt-${i}-${correct_idx}`).classList.add('correct');
    }
  });

  // Show result
  const panel = document.getElementById('resultPanel');
  panel.classList.add('show');

  const circle = document.getElementById('scoreCircle');
  document.getElementById('scoreNum').textContent = correct;
  document.getElementById('statCorrect').textContent = correct;
  document.getElementById('statWrong').textContent = wrong;
  document.getElementById('statSkip').textContent = skip;

  const pct = correct / 50;
  if (pct >= 0.8) {
    circle.className = 'score-circle score-great';
    document.getElementById('resultTitle').textContent = '🎉 Luar Biasa!';
    document.getElementById('resultSub').textContent = 'Kamu sangat siap untuk Lomba Lentera!';
  } else if (pct >= 0.6) {
    circle.className = 'score-circle score-ok';
    document.getElementById('resultTitle').textContent = '👍 Bagus!';
    document.getElementById('resultSub').textContent = 'Tingkatkan lagi di bagian yang salah ya!';
  } else {
    circle.className = 'score-circle score-low';
    document.getElementById('resultTitle').textContent = '💪 Tetap Semangat!';
    document.getElementById('resultSub').textContent = 'Review materinya dan coba lagi, pasti bisa!';
  }

  document.getElementById('btnSubmit').disabled = true;
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetQuiz() {
  userAnswers = new Array(50).fill(null);
  submitted = false;
  document.getElementById('resultPanel').classList.remove('show');
  document.getElementById('btnSubmit').disabled = false;
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressCount').textContent = '0 / 50';
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
